# configurações de feriados e datas relevantes
# determina quais eventos serão considerados no projeto de previsão de vendas
#
# categorias:
#
# national    -> feriados nacionais oficiais
# regional    -> feriados estaduais ou municipais
# commercial  -> datas com potencial impacto comercial nas vendas
# observance  -> datas comemorativas ou de conscientização
#
#
# estrutura para inclusão de novos eventos:
#
# name: nome do evento (obrigatório)
# month: mês do evento, para datas fixas (opcional)
# day: dia do evento, para datas fixas (opcional)
# base: base de cálculo do evento, para datas móveis (opcional)
# offset_days: deslocamento em dias a partir da base (opcional)
# rule: regra de cálculo do evento, para datas específicas (opcional)


# feriados nacionais oficiais
national:

  - name: "Ano Novo"
    month: 1
    day: 1

  # 2 dias antes da Páscoa
  - name: "Sexta-feira Santa"
    base: "easter"
    offset_days: -2

  - name: "Tiradentes"
    month: 4
    day: 21

  - name: "Dia do Trabalho"
    month: 5
    day: 1

  - name: "Independência do Brasil"
    month: 9
    day: 7

  - name: "Nossa Senhora Aparecida"
    month: 10
    day: 12

  - name: "Finados"
    month: 11
    day: 2

  - name: "Proclamação da República"
    month: 11
    day: 15

  - name: "Dia Nacional de Zumbi e da Consciência Negra"
    month: 11
    day: 20

  - name: "Natal"
    month: 12
    day: 25


# feriados regionais
regional:

  # feriados estaduais
  state:

    - name: "Data Magna do Ceará"
      state: "CE"
      month: 3
      day: 19

    - name: "Data Magna de São Paulo"
      state: "SP"
      month: 7
      day: 9

  # feriados municipais
  municipal:

    - name: "Aniversário de Fortaleza"
      state: "CE"
      city: "Fortaleza"
      month: 4
      day: 13


# datas com potencial impacto comercial
commercial:

  # 47 dias antes da Páscoa
  - name: "Carnaval"
    base: "easter"
    offset_days: -47

  # 60 dias depois da Páscoa
  - name: "Corpus Christi"
    base: "easter"
    offset_days: 60

  # segundo domingo de maio
  - name: "Dia das Mães"
    rule: "second_sunday_of_may"

  # segundo domingo de agosto
  - name: "Dia dos Pais"
    rule: "second_sunday_of_august"

  - name: "Dia dos Namorados"
    month: 6
    day: 12

  # última sexta-feira de novembro
  - name: "Black Friday"
    rule: "last_friday_of_november"

  # segunda-feira após a Black Friday
  - name: "Cyber Monday"
    rule: "monday_after_black_friday"

  # domingo de páscoa
  - name: "Páscoa"
    base: "easter"
    offset_days: 0

  - name: "Dia das Crianças"
    month: 10
    day: 12


# datas comemorativas ou de conscientização
observance:

  - name: "Dia Internacional da Mulher"
    month: 3
    day: 8

  - name: "Dia do Consumidor"
    month: 3
    day: 15

  # início do inverno
  - name: "Início do Inverno"
    rule: "winter_start"

  # início da primavera
  - name: "Início da Primavera"
    rule: "spring_start"